# Режим за замовчуванням — long polling (BOT_MODE=polling): машина має працювати постійно.
# HTTP-сервіс (/healthz і /telegram/webhook) піднятий в обох режимах.
# Має бути рівно ОДНА машина — два інстанси на одному токені конфліктують у Telegram.
# Як перейти на webhook — див. README, розділ «Webhook».

app = 'photo-approval-bot'
primary_region = 'fra'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/bot.db'
  PORT = '8080'
  BOT_MODE = 'polling'
  WEBHOOK_BASE_URL = 'https://photo-approval-bot.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  # polling: машина не повинна засинати (інакше бот перестане отримувати повідомлення)
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

# SQLite (менеджери, заявки, поточний апрувер) живе на томі
[mounts]
  source = 'photobot_data'
  destination = '/data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # aiogram 3 при імпорті будує pydantic-моделі всього Bot API (~170-230 МБ RSS);
  # на 256 МБ процес вбиває OOM ще до старту polling
  memory = '512mb'
