name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # Ручне підтвердження: Settings → Environments → production → Required reviewers.
    # Без цього правила джоба запуститься автоматично.
    environment:
      name: production
      url: https://fly.io/apps/photo-approval-bot
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: npm run deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
